server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: khedma-taktak-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/khedma_taktak?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: dalido
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-local-jwt-secret-key-minimum-32-chars!!}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:60}
    refresh-token-expiration-days: 7
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  cv-parser:
    # External CV extraction service (Python). Backend only proxies the file.
    enabled: ${CV_API_ENABLED:true}
    base-url: ${CV_API_BASE_URL:http://localhost:8000}
    import-path: ${CV_API_IMPORT_PATH:/v1/cv/import}
    health-path: ${CV_API_HEALTH_PATH:/health}
    # LLM extraction can take several minutes on first call / large CVs
    timeout-seconds: ${CV_API_TIMEOUT_SECONDS:300}
